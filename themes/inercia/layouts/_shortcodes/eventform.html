<!--
layouts/shortcodes/eventform.html
Call this shortcode from a content page (see chat for the exact
invocation syntax - not included here since Hugo parses this whole
file as a Go template, including comments).

Labels are pulled from i18n/en.toml and i18n/pt.toml automatically
based on the language of the page the shortcode is used on.

Swap FORMSUBMIT_ENDPOINT below for your target email once you confirm
it via FormSubmit.co's confirmation email (sent on first submission).

All fields are mandatory per spec, including the checkbox group
(days attending), enforced via the inline script since native HTML
checkboxes can't require "at least one checked" on their own.
-->

<form

  method="POST"
  id="event-form"
  class="o-eventform"

  <input type="hidden" name="_template" value="table" />
  <input type="hidden" name="_captcha" value="false" />

  <input type="hidden" name="_next" value="{{ i18n "form_thanks" }}">

  <div class="o-eventform__field">
    <label class="o-eventform__label" for="email">{{ i18n "form_email_label" }}</label>

      <option value="Standard entrance fee (5 EUR/day)">{{ i18n "entrance_standard" }}</option>
      <option value="Supporter entrance fee (100 EUR)">{{ i18n "entrance_supporter" }}</option>

    </div>

  <fieldset class="o-eventform__field o-eventform__fieldset">

  <div class="o-eventform__actions">

  </div>

<script>
  document.getElementById('event-form').addEventListener('submit', function (e) {
    var fieldset = document.getElementById('days-fieldset');
    var days = fieldset.querySelectorAll('input[type="checkbox"]:checked');
    var errorEl = document.getElementById('days-error');
    if (days.length === 0) {
      e.preventDefault();
      errorEl.style.display = 'block';
      fieldset.classList.add('-invalid');
      fieldset.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } else {
      errorEl.style.display = 'none';
      fieldset.classList.remove('-invalid');
    }
  });
</script>
